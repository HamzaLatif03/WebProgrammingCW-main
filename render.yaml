databases:
  - name: hobbyfriends-db
    plan: free
    databaseName: hobbyfriends
    user: hobbyfriends

services:
  - type: web
    name: hobbyfriends
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn project.wsgi --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hobbyfriends-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
