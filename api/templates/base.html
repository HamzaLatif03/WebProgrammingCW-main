<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --royal-blue: #2244cc;
        }
        
        html {
            height: 100%;
        }
        
        body {
            min-height: 100%;
            background-color: #f8f9fa;
            padding: 2rem 0;
        }
        
        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100%;
            padding: 20px;
        }
        
        .auth-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
        }
        
        .auth-title {
            color: #333;
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        
        .form-label {
            font-weight: 500;
            color: #555;
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 1rem;
        }
        
        .btn-royal-blue {
            background-color: var(--royal-blue);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-royal-blue:hover {
            background-color: #1a3399;
            color: white;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1rem;
        }

        .auth-footer a {
            color: var(--royal-blue);
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #dc3545;
            list-style: none;
            padding: 0;
            margin: 5px 0;
            font-size: 0.9rem;
        }

        @media (max-width: 576px) {
            .auth-container {
                padding: 1.5rem;
                margin: 10px;
            }
            
            body {
                padding: 1rem 0;
            }
        }
            
        .alert {
                padding: 0.75rem 1.25rem;
                margin-bottom: 1rem;
                border: 1px solid transparent;
                border-radius: 0.25rem;
        }
            
        .alert-danger {
                color: #721c24;
                background-color: #f8d7da;
                border-color: #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
